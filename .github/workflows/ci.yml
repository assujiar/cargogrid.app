# CargoGrid CI baseline — Phase 0 (CG-S5-PH0-009, Prompt 88).
#
# Platform choice: docs/adr/ADR-0004-cicd-platform.md (GitHub Actions —
# "integrated with this repository's Git host," ADR-CAND-ARCH-024).
# Policy this workflow implements: docs/git/GIT_STRATEGY.md §3 (mandatory PR,
# trunk-based) and §7 (this is the mandatory, not merely recommended, path
# once branch protection requires it — see docs/build-log/phase-00/PH0-88.md).
#
# Scope note: this is the MINIMUM trusted baseline for the current
# repository state. Gates that require a real subject (accessibility-against-
# real-UI, build) are deliberately NOT wired here — there is nothing yet for
# them to run against. Adding a fabricated passing step for a gate with no real
# subject would be worse than omitting it. See docs/build-log/phase-00/PH0-88.md
# §3 for the exact "N/A for now, wired when X lands" table.
#
# `db` job added at CG-S6-PLT-002 (Prompt 105, Tenant Provisioning and
# Lifecycle) — the first Platform Core capability to ship a real migration.
# Runs every supabase/migrations/*.sql file plus scripts/db-tests/*.sql
# against a real, disposable Postgres service container (not a fabricated
# always-pass gate) — see scripts/db-tests/run.sh.
#
# `e2e` job added at CG-S5-PH0-012 (Prompt 91, Testing Foundation —
# ADR-0007/ADR-0008): runs the real Playwright + @axe-core/playwright smoke
# suite (e2e/smoke.spec.ts) against synthetic inline content only — proves
# the browser-automation/accessibility-checker layer is wired, not a test of
# any real CargoGrid page (none exists yet, docs/standards/TESTING_STANDARDS.md
# §7's NOT_RUN table). Runs in parallel with `quality`, not serialized after
# it (docs/standards/TESTING_STANDARDS.md §3 — no shared migrated-schema
# dependency exists yet to force ordering).
#
# No secret is defined or required by any step below — nothing in this
# repository yet needs one. Triggered by `pull_request` (not
# `pull_request_target`), so a fork's PR runs with GitHub's default
# read-only token and no repository secrets (docs/build-log/phase-00/PH0-88.md
# §4 explains this choice explicitly).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run for the same ref — avoids burning runner time on
# stale pushes to the same PR/branch (Prompt 88 §3 "concurrency/cancellation").
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (§26): read-only, no write/deploy/secret access. No other
# permission is requested because no step below needs one.
permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (typecheck, lint, test, policy checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone — required for the base-ref
          # diffing check-protected-paths.ts performs below (git diff
          # origin/<base>...HEAD only resolves with real history present).
          fetch-depth: 0

      - name: Enable Corepack (pins pnpm to package.json's "packageManager" field)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile — deterministic install)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Suppression governance check
        run: pnpm run standards:check

      - name: Documentation checks (link resolution, canonical files, ADR index, HANDOFF coherence)
        run: pnpm run docs:check

      - name: Prompt package structure check (docs/build-log/final-package-validation/, Step 17)
        run: pnpm run package:check

      # The §3 issue index had drifted to 63 rows for 261 records, and 78 record
      # headings declared a status their own body contradicted -- so every backlog
      # count taken from KNOWN_ISSUES.md was wrong, always understating how much was
      # already done. Reconciled 2026-08-30; this keeps it reconciled.
      - name: Known-issues ledger check (index covers every record, statuses agree)
        run: pnpm run issues:check

      # ISS-2026-248: the two defect classes ISS-2026-247 fixed by hand -- a wide
      # table with no horizontal-scroll wrapper, and an interactive control below the
      # 44px touch-target floor -- were things a reviewer had to catch by eye, so both
      # could silently come back. The entry concluded this could not be an ESLint rule,
      # correctly: "table with no wrapper in the same file" is a file-level absence
      # check, which a per-node no-restricted-syntax selector cannot express. It is a
      # checker script instead, the same shape as the nine gates around it.
      - name: Interaction primitives (table scroll wrappers, touch-target floor)
        run: pnpm run ui:check

      - name: Secret scan (docs/standards/SECURITY_STANDARDS.md §3)
        run: pnpm run security:check

      # ISS-2026-240 (Track B Batch 6): the auth_rls_initplan regression check had
      # never existed as committed tooling -- only as an ad hoc manual grep re-run
      # by hand at each checkpoint. This wires the real, committed guard in so it
      # actually runs, rather than existing as an unused script (the exact
      # "looks fixed without being fixed" anti-pattern this repo forbids).
      - name: RLS auth.uid() initplan regression guard (bare-call + override detection)
        run: pnpm run security:check-rls-initplan

      # ATW-031 (closes ISS-2026-007): the repository had NO automated dependency
      # vulnerability gate from PH0-094 until this checkpoint, because `pnpm audit`
      # was returning 410 Gone against npm's retired advisory endpoints and PH0-094
      # correctly refused to wire a fabricated pass. It works again -- and re-running
      # it found 11 high-severity advisories that had accumulated unseen, four of them
      # in Next.js itself. The gate fails on critical/high, and also fails (never
      # silently passes) if the advisory service cannot be reached at all.
      - name: Dependency vulnerability audit (fails on critical/high)
        run: pnpm run security:audit

      - name: Data-classification registry check (docs/standards/DATA_CLASSIFICATION_STANDARDS.md §6/§7)
        run: pnpm run data-classification:check

      - name: Threat model register check (docs/security/THREAT_MODEL.md)
        run: pnpm run threat-model:check

      # RGL-393 (CG-S16-RGL-003, No-New-Feature Rule): enforces the release-candidate
      # freeze CG-S16-RGL-002 recorded. Fails closed if the migration set, db-test set
      # or resolved dependency set drifts from RC-2026.08.25-1's frozen digests.
      # Scope note, deliberately explicit: this is a repository-CONTENT gate. It cannot
      # police a direct push to `main` (unprotected — RGL-393.md §3) nor the Vercel
      # `main` -> production auto-deploy (RGL-BLK-001). A pass here does not mean the
      # candidate is sealed, and no lane may report it as though it does.
      - name: Release-candidate freeze check (docs/build-log/release-go-live/RGL-392.md)
        run: pnpm run release:check-freeze

      - name: Branch name check (PR only)
        if: github.event_name == 'pull_request'
        run: node --experimental-strip-types scripts/git/check-branch-name.ts "${{ github.head_ref }}"

      - name: Commit message check (PR head commit only)
        if: github.event_name == 'pull_request'
        run: node --experimental-strip-types scripts/git/check-commit-message.ts --message "$(git log -1 --format=%s ${{ github.event.pull_request.head.sha }})"

      - name: Protected-path check (PR diff against base branch)
        if: github.event_name == 'pull_request'
        run: node --experimental-strip-types scripts/git/check-protected-paths.ts "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}"

      # ISS-2026-288. Deliberately NOT status-based, unlike the check above: a branch that
      # predates the base branch's own copy of a migration shows that file as ADDED on both
      # sides, which every status rule waves through. This compares content against the base
      # branch's current tree instead. The explicit fetch is required -- actions/checkout is
      # shallow by default, and the check fails loudly rather than passing when it cannot see
      # the base branch, since a green tick that never looked at anything is worse than none.
      - name: Applied-migration collision check (content vs base branch)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node --experimental-strip-types scripts/git/check-applied-migration-collision.ts FETCH_HEAD

      - name: Evidence summary
        if: always()
        run: |
          {
            echo "### CI evidence — commit \`${{ github.sha }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Node | $(node --version) |"
            echo "| pnpm | $(pnpm --version) |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Ref | ${{ github.ref }} |"
            echo "| Workflow run | ${{ github.run_id }} (attempt ${{ github.run_attempt }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  db:
    name: Database migrations + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # PLT-134/ADR-0014: postgis/postgis:17-3.4 (Postgres 17, matching this workflow's
      # own prior plain postgres:17 pin, plus PostGIS 3.4 — required since
      # 20260722090000_enable_postgis_spatial_foundation.sql's own `create extension
      # postgis` needs the extension's control/library files present in the image, not
      # merely installable at runtime).
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrations and RLS tests (scripts/db-tests/run.sh)
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash scripts/db-tests/run.sh

  e2e:
    name: E2E/accessibility smoke (Playwright + axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pins pnpm to package.json's "packageManager" field)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile — deterministic install)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (matches playwright.config.ts's single chromium project)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E/accessibility smoke
        run: pnpm run test:e2e

      - name: Upload Playwright report (only on failure — no real tenant/app data, synthetic fixtures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
